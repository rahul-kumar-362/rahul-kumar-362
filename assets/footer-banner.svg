<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c2e59c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#64b3f4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="900" height="150" fill="#0d1117"/>

  <!-- Wave bottom -->
  <path d="M0,50 Q225,20 450,50 T900,50 L900,0 L0,0 Z" fill="#0d1117"/>
  <path d="M0,60 Q225,30 450,60 T900,60 L900,150 L0,150 Z" fill="url(#fGrad)" opacity="0.15"/>
  <path d="M0,80 Q225,50 450,80 T900,80 L900,150 L0,150 Z" fill="url(#fGrad)" opacity="0.25"/>

  <!-- Text -->
  <text x="450" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff">Thanks for visiting!</text>
</svg>
